services:
  # =============================================================================
  # DATABASE & STORAGE SERVICES
  # =============================================================================

  # PostgreSQL database for Airflow metadata (DAGs, tasks, logs)  
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -q"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis broker for Airflow Celery executor task distribution
  airflow-redis:
    image: redis:7
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database for MLflow experiments and model metadata
  mlflow-postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -q"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO object storage for models, datasets, and artifacts
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    environment:
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "minio123"
    volumes:
      - minio_data:/data/minio
    command: 'minio server /data/minio --console-address ":8900"'
    networks: [real_estate_predictor]

  # =============================================================================
  # AIRFLOW SERVICES
  # =============================================================================

  # One-time initialization of Airflow database and admin user  
  airflow-init:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-init
    depends_on: [airflow-postgres, airflow-redis]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.com"
    networks: [real_estate_predictor]

  # Airflow web UI for DAG management and monitoring
  airflow-webserver:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-webserver
    depends_on: [airflow-postgres, airflow-redis, airflow-init]
    environment:
      PROJECT_ROOT: /opt/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
    command: webserver
    ports: ["8089:8080"]
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow task scheduler and executor
  airflow-scheduler:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-scheduler
    depends_on: [airflow-postgres, airflow-redis, airflow-webserver]
    environment:
      PROJECT_ROOT: /opt/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"
    command: scheduler
    volumes:
      - ./data:/opt/project/data
      - ./ml_models:/opt/project/ml_models
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "airflow scheduler"]
      interval: 30s
      timeout: 10s
      retries: 5

  #TODO: Add airflow-worker service for distributed task execution with Celery

  # =============================================================================
  # ML & ANALYTICS SERVICES
  # =============================================================================

  # MLflow experiment tracking and model registry server
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: mlflow
    depends_on:
      - mlflow-postgres
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"
    entrypoint: >
      mlflow server 
        --backend-store-uri postgresql+psycopg2://mlflow:mlflow@mlflow-postgres/mlflow 
        --default-artifact-root s3://mlflow 
        --artifacts-destination s3://mlflow
        -h 0.0.0.0
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks: [real_estate_predictor]

  # =============================================================================
  # APPLICATION SERVICES
  # =============================================================================

  # Streamlit dashboard for data visualization and analytics
  dashboard-app:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    container_name: dashboard-app
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    networks: [real_estate_predictor]

  # FastAPI service for real estate price predictions
  predictor-api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: predictor-api
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ml_models:/app/ml_models
    ports:
      - "8000:8000"
    networks: [real_estate_predictor]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  real_estate_predictor:

volumes:
  airflow_db_data:
  mlflow_db_data:
  minio_data:
